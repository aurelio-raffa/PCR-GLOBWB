# =====================================================================================================
# PCR-GLOBWB pipeline (MLflow-tracked).  Run with:
#
#     python run_project.py --config_file=config/pipeline/pcrglobwb_pipeline.yaml \
#                           --experiment_name=pcrglobwb_run01
#
# The orchestrator (src/stages/run.py) executes the `stages` below in order, each as its own MLflow run.
# `{{$VAR}}` placeholders are filled from environment variables at load time (an undefined var -> ''), so
# the LSF submission script (generated by create_job_file.py) injects the cluster-specific paths.
# Replace the placeholders / env vars with your own values.
# =====================================================================================================

project_uri: 'src/stages'          # directory holding the stage scripts (do not change)
log_artifacts: false               # artifact logging policy -- see the block just below
description: 'PCR-GLOBWB 5-arcmin parallel run, tracked end-to-end'

tags:                              # arbitrary tags attached to the parent (orchestrator) run
    version: '1.0'
    resolution: '05min'

# -----------------------------------------------------------------------------------------------------
# MLflow artifact logging (handled by src/stages/run.py).  This is PURELY ADDITIVE: every key below is
# always forwarded verbatim to its stage as a real CLI argument -- nothing is renamed, removed, or
# hidden from the stage. After a stage runs, the orchestrator also inspects its parameters and, for any
# whose NAME is in the artifact-name allowlist, logs the file at that parameter's path as an artifact on
# the parent run. Such parameters are flagged below with `# -> MLflow artifact`.
#   allowlisted parameter names : config, config-path, config-file, config-ini, summary, summary-path,
#                                 output-summary, metrics, metrics-path, metrics-config, output-metrics,
#                                 csv-path, output-csv, output-path, output-image
#   logged by default (log_artifacts: false) only when the file extension is one of:
#                                 .ini  .yaml  .yml  .json  .txt  .csv
#   log_artifacts: true         -> also log allowlisted params with ANY extension (e.g. .png, .log, .nc)
# The fully-substituted copy of THIS yaml is ALWAYS logged as an artifact, regardless of the above.
# `metrics-path` is, in addition, read as a flat {name: number} JSON and logged as MLflow metrics.
# -----------------------------------------------------------------------------------------------------

stages:

    # 1) create the output / working directories (keys are arbitrary; every value is a dir to create) -----
    - setup:
        hard_clean: false
        output_dir:     '{{$PCRG_RUN_DIR}}/output'
        config_dir:     '{{$PCRG_RUN_DIR}}/ini'
        clone_maps_dir: '{{$PCRG_RUN_DIR}}/clone_maps'
        basins_dir:     '{{$PCRG_RUN_DIR}}/basins'
        reporting_dir:  '{{$PCRG_RUN_DIR}}/reports'

    # 2) OPTIONAL: inspect the partition (validate inputs + tile summary text + colour-coded image). Also
    #     runnable standalone on a partition NPZ (`python inspect_partition.py --partition foo.npz ...`) or on
    #     a directory of clone/landmask maps (`--maps_dir DIR --landmask_pattern 'mask_%s.map'`).
    - inspect_partition:
        maps-dir: '{{$CLONE_MAP_DIR}}'
        landmask-pattern: '{{$LANDMASK_PATTERN}}'     # typically: mask_%s.map or landmask_%s.map
        clone-pattern: '{{$CLONE_MAP_PATTERN}}'       # typically: clone_%s.map
        output-summary: '{{$PCRG_RUN_DIR}}/reports/partition_summary.txt'   # -> MLflow artifact (.txt)
        output-image: '{{$PCRG_RUN_DIR}}/reports/partition.png'             # -> MLflow artifact (only when log_artifacts: true)

    # 3) instantiate the INI from a template; `output-path` is the concrete INI handed to stage 4 -----------
    - create_ini:
        base-ini:      'config/05min_parallel.ini'
        name:          'pcrglobwb_run01'
        output-dir:    '{{$PCRG_RUN_DIR}}/output'              # -> INI [globalOptions] outputDir
        clone-map:     '{{$CLONE_MAP_DIR}}/{{$CLONE_MAP_PATTERN}}'      # must contain %s for parallel runs
        landmask:      '{{$CLONE_MAP_DIR}}/{{$LANDMASK_PATTERN}}'       # must contain %s for parallel runs
        global-clone-map: '{{$GLOBAL_CLONE_MAP}}'             # whole-domain clone for the merging process; unset -> 'None' -> falls back to routing lddMap
        input-dir:     '{{$PCRG_INPUT_DIR}}'
        clone-areas:   'Global'                               # Global | part_one | part_two | "M01,M03,..."
        with-merging:  'True'                                 # 'True' merges per-tile outputs into globals
        low-res-data:  'global_30min'
        high-res-data: 'global_05min'
        novalidation:  true                                  # true skips on-disk path checks (local dry-run)
        output-path:   '{{$PCRG_RUN_DIR}}/ini/pcrglobwb_run.ini'        # -> MLflow artifact (.ini): the generated INI

    # 4) launch the model. mode: parallel (tiled, default) | serial -----------------------------------------
    #    The merging/global process uses the routing `lddMap` as its whole-domain clone by default; override
    #    with the GLOBAL_CLONE_MAP env var (or a `globalCloneMap` line in the base INI). See PIPELINE.md.
    - run_model:
        mode:         'parallel'                              # parallel | serial
        runner:       'basic'                                 # basic | with_arguments  (parallel mode only)
        config:       '{{$PCRG_RUN_DIR}}/ini/pcrglobwb_run.ini'   # = create_ini's output-path; -> MLflow artifact (.ini)
        debug-option: 'parallel'                             # runner's 2nd positional arg (parallel mode)
        extra-args:   ''                                     # shell-split, appended verbatim
        log-file:     '{{$PCRG_RUN_DIR}}/output/model_run.log'   # tee model stdout+stderr here for the diagnostics stage
        continue-on-error: true                              # a model crash does NOT abort here: flow into diagnostics
                                                             #   first (which writes its outputs), then fail at the end.

    # 5) diagnose the run from the model's convenience logfile. Catches SILENT failures (the parallel runner
    #    backgrounds every process, so a crash inside a subprocess need not change the job's exit code) AND
    #    LOUD ones (run_model above is continue-on-error, so a crashed model still reaches this stage). This
    #    stage always writes its summary/CSV/metrics to disk first; with fail-on-error:true it then reports
    #    failure when the log shows a fatal error, and being continue-on-error that failure is deferred so its
    #    artifacts are still logged before the pipeline is failed at the end of the run.
    #    Standalone: `python diagnostics.py --log-file run.log --summary-path s.txt`.
    - diagnostics:
        log-file:      '{{$PCRG_RUN_DIR}}/output/model_run.log'             # input: the logfile run_model teed
        summary-path:  '{{$PCRG_RUN_DIR}}/reports/diagnostics_summary.txt'  # -> MLflow artifact (.txt)
        csv-path:      '{{$PCRG_RUN_DIR}}/reports/diagnostics.csv'          # -> MLflow artifact (.csv)
        metrics-path:  '{{$PCRG_RUN_DIR}}/reports/diagnostics_metrics.json' # -> MLflow artifact (.json) + logged as metrics
        fail-on-error: true                                  # true -> a fatal model error fails the pipeline
        continue-on-error: true                              # ...but only after this stage's outputs are written/logged

    # 6) OPTIONAL FINAL STAGE: plot a model output variable (map / animation / time series). Skipped by
    #    default — set skip:false and point nc-path/variable at a file the run actually produced.
    - plot_output:
        skip:     false
        nc-path:  '{{$PCRG_RUN_DIR}}/output/global/netcdf/discharge_monthAvg_output.nc'
        variable: 'discharge'
        outdir:   '{{$PCRG_RUN_DIR}}/reports'
        log:      true
