# =====================================================================================================
# PCR-GLOBWB pipeline (MLflow-tracked).  Run with:
#
#     python run_project.py --config_file=config/pipeline/pcrglobwb_pipeline.yaml \
#                           --experiment_name=pcrglobwb_run01
#
# The orchestrator (src/stages/run.py) executes the `stages` below in order, each as its own MLflow run.
# `{{$VAR}}` placeholders are filled from environment variables at load time (an undefined var -> ''), so
# the LSF submission script (config/pipeline/submit_pipeline.lsf) injects the cluster-specific paths.
# Replace the placeholders / env vars with your own values.
# =====================================================================================================

project_uri: 'src/stages'          # directory holding the stage scripts (do not change)
log_artifacts: false               # if true, each stage's `output-path` is logged as an MLflow artifact
description: 'PCR-GLOBWB 5-arcmin parallel run, tracked end-to-end'

tags:                              # arbitrary tags attached to the parent (orchestrator) run
    version: '1.0'
    resolution: '05min'

stages:

    # 1) create the output / working directories (keys are arbitrary; every value is a dir to create) -----
    - setup:
        hard_clean: false
        output_dir:     '{{$PCRG_RUN_DIR}}/output'
        config_dir:     '{{$PCRG_RUN_DIR}}/ini'
        clone_maps_dir: '{{$PCRG_RUN_DIR}}/clone_maps'
        basins_dir:     '{{$PCRG_RUN_DIR}}/basins'
        reporting_dir:  '{{$PCRG_RUN_DIR}}/reports'

    # 2) OPTIONAL: inspect the partition (validate inputs + tile summary text + colour-coded image). Also
    #     runnable standalone on a partition NPZ (`python inspect_partition.py --partition foo.npz ...`) or on
    #     a directory of clone/landmask maps (`--maps_dir DIR --landmask_pattern 'mask_%s.map'`).
    - inspect_partition:
        maps-dir: '{{$CLONE_MAP_DIR}}'
        landmask-pattern: '{{$LANDMASK_PATTERN}}'     # typically: mask_%s.map or landmask_%s.map
        clone-pattern: '{{$CLONE_MAP_PATTERN}}'       # typically: clone_%s.map
        output-summary: '{{$PCRG_RUN_DIR}}/reports/partition_summary.txt'
        output-image: '{{$PCRG_RUN_DIR}}/reports/partition.png'

    # 3) instantiate the INI from a template; `output-path` is the concrete INI handed to stage 4 -----------
    - create_ini:
        base-ini:      'config/05min_parallel.ini'
        name:          'pcrglobwb_run01'
        output-dir:    '{{$PCRG_RUN_DIR}}/output'              # -> INI [globalOptions] outputDir
        clone-map:     '{{$CLONE_MAP_DIR}}/{{$CLONE_MAP_PATTERN}}'      # must contain %s for parallel runs
        landmask:      '{{$CLONE_MAP_DIR}}/{{$LANDMASK_PATTERN}}'       # must contain %s for parallel runs
        input-dir:     '{{$PCRG_INPUT_DIR}}'
        clone-areas:   'Global'                               # Global | part_one | part_two | "M01,M03,..."
        with-merging:  'True'                                 # 'True' merges per-tile outputs into globals
        low-res-data:  'global_30min'
        high-res-data: 'global_05min'
        novalidation:  true                                  # true skips on-disk path checks (local dry-run)
        output-path:   '{{$PCRG_RUN_DIR}}/ini/pcrglobwb_run.ini'

    # 4) launch the model. mode: parallel (tiled, default) | serial -----------------------------------------
    - run_model:
        mode:         'parallel'                              # parallel | serial
        runner:       'basic'                                 # basic | with_arguments  (parallel mode only)
        config:       '{{$PCRG_RUN_DIR}}/ini/pcrglobwb_run.ini'   # = create_ini's output-path
        debug-option: 'parallel'                             # runner's 2nd positional arg (parallel mode)
        extra-args:   ''                                     # shell-split, appended verbatim

    # 5) OPTIONAL FINAL STAGE: plot a model output variable (map / animation / time series). Skipped by
    #    default — set skip:false and point nc-path/variable at a file the run actually produced.
    - plot_output:
        skip:     false
        nc-path:  '{{$PCRG_RUN_DIR}}/output/global/netcdf/discharge_monthAvg_output.nc'
        variable: 'discharge'
        outdir:   '{{$PCRG_RUN_DIR}}/reports'
        log:      true
